services:
  - type: web
    name: palm-ai
    plan: free
    runtime: docker
    rootDir: .
    dockerfilePath: ./Dockerfile
    dockerContext: .
 
    healthCheckPath: /api/health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: YOLO_CONFIG_DIR
        value: "/tmp/ultralytics"
      - key: MPLCONFIGDIR
        value: "/tmp/matplotlib"
