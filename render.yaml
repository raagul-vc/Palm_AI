services:
  - type: web
    name: palm-ai
    runtime: docker
    rootDir: .
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: sh -c 'exec gunicorn backend.api:app --bind 0.0.0.0:${PORT:-10000} --workers ${WEB_CONCURRENCY:-2}'
    healthCheckPath: /api/health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: WEB_CONCURRENCY
        value: "2"
